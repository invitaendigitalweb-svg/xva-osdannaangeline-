<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Invitación</title>

  <!-- METATAGS PARA MINIATURA DE WHATSAPP -->
  <meta property="og:title" content="Mi Invitación">
  <meta property="og:description" content="¡Estás invitado a mis XV años! Haz click para ver los detalles.">
  <meta property="og:image" content="miniatura.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="300">
  <meta property="og:image:height" content="300">

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #F9F8F5;
      font-family: 'Cinzel', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* MARCO DE CELULAR ADAPTABLE */
    .mobile-screen {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-color: #F9F8F5;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    /* SCROLL INTERIOR SIN BARRA VISIBLE */
    .invitation-wrapper {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background-color: #F9F8F5;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .invitation-wrapper.open-portada {
      opacity: 1;
    }

    .invitation-wrapper::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    /* BOTÓN FLOTANTE DE MÚSICA */
    .music-btn {
      position: absolute;
      bottom: 25px;
      right: 20px;
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #a3d0f3 0%, #7ABAE7 100%);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 12px rgba(122, 186, 231, 0.4);
      cursor: pointer;
      z-index: 9;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, transform 0.2s ease, visibility 0.5s ease;
    }

    .music-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .music-btn:active {
      transform: scale(0.9);
    }

    .music-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .music-btn.playing svg {
      animation: pulseMusic 2s infinite linear;
    }

    @keyframes pulseMusic {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* ESTILOS DE IMÁGENES (SIN ESPACIOS ENTRE SÍ) */
    .image-section {
      width: 100%;
      background-color: #F9F8F5;
      display: block;
      position: relative;
      margin: 0;
      padding: 0;
      line-height: 0;
    }

    .image-section img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
    }

    /* PORTADA */
    .portada-section {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
    }

    .portada-section img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
      transform: translateY(0);
      transition: transform 1.8s ease-out, opacity 1.8s ease-out;
    }

    .open-portada .portada-section img {
      opacity: 1;
      animation: floatPortada 4s ease-in-out infinite alternate;
    }

    @keyframes floatPortada {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-6px) scale(1.005); }
    }

    /* --- SECCIÓN DE CUENTA REGRESIVA --- */
    .countdown-section {
      background-color: #F9F8F5;
      padding: 30px 15px;
      text-align: center;
      width: 100%;
      line-height: normal;
    }

    .countdown-flex {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      max-width: 380px;
      margin: 0 auto;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 65px;
    }

    .countdown-number {
      font-size: 42px;
      font-weight: 500;
      color: #1A1A1A;
      font-family: 'Cormorant Garamond', serif;
      line-height: 1;
      margin-bottom: 4px;
    }

    .countdown-label {
      font-size: 15px;
      color: #7ABAE7;
      font-weight: 600;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      text-transform: none;
    }

    .countdown-divider {
      font-size: 18px;
      color: #a3d0f3;
      margin-top: -20px;
      user-select: none;
    }

    /* SECCIÓN DE CEREMONIA */
    .ceremony-container {
      position: relative;
      width: 100%;
    }

    .btn-overlay {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #a3d0f3 0%, #7ABAE7 100%);
      color: #ffffff;
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 12px rgba(122, 186, 231, 0.4);
      transition: all 0.3s ease;
      z-index: 5;
      white-space: nowrap;
      line-height: 1;
    }

    .btn-overlay:active {
      transform: scale(0.95);
    }

    .btn-overlay svg {
      width: 14px;
      height: 14px;
      fill: #ffffff;
    }

    .btn-ubicacion-salon {
      bottom: 16%;
      left: 41%;
      transform: translateX(-50%);
    }

    .reveal-section {
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      transition: opacity 1s ease-out, transform 1s ease-out;
    }

    .reveal-section.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* ESTILOS FORMULARIO ASISTENCIA EN AZUL #7CC4F0 */
    .rsvp-container-wrapper {
      width: 100%;
      background-color: #F9F8F5;
      padding: 30px 15px 60px 15px;
      display: flex;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      line-height: normal;
    }

    .tarjeta {
      width: 100%;
      background: rgba(255, 255, 255, .95);
      border: 1px solid #7CC4F0;
      border-radius: 25px;
      padding: 35px 28px;
      box-shadow: 0 15px 45px rgba(124, 196, 240, .2);
      position: relative;
    }

    .grupo {
      margin-bottom: 22px;
      position: relative;
    }

    .etiqueta {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      color: #7CC4F0;
      margin-bottom: 10px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 15px;
      border-radius: 12px;
      border: 1px solid #c1e0f7;
      background: #fffaf5;
      outline: none;
      font-family: 'Montserrat', sans-serif;
      color: #1A1A1A;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: #7CC4F0;
      box-shadow: 0 0 8px rgba(124, 196, 240, 0.4);
    }

    .opciones {
      display: flex;
      gap: 12px;
    }

    .opcion {
      flex: 1;
    }

    .opcion input {
      display: none;
    }

    .opcion label {
      display: block;
      text-align: center;
      padding: 13px 8px;
      border: 1px solid #c1e0f7;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      background: #fffaf5;
      transition: .2s;
    }

    .opcion input:checked + label {
      background: #7CC4F0;
      border-color: #7CC4F0;
      color: #ffffff;
      font-weight: 600;
    }

    .boton {
      width: 100%;
      border: 0;
      border-radius: 30px;
      padding: 16px;
      background: #7CC4F0;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(124, 196, 240, 0.4);
      transition: all 0.2s ease;
    }

    .boton:hover {
      background: #62b1e2;
    }

    .boton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .mensaje {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f2f8fd;
      border: 1px solid #c1e0f7;
      line-height: 1.5;
      font-size: 13.5px;
      color: #1A1A1A;
    }

    .mensaje.visible {
      display: block;
    }

    /* SOBRE DE BIENVENIDA */
    .envelope-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      cursor: pointer;
      perspective: 1200px;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F9F8F5;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('sobre.jpg');
      background-size: cover;
      background-position: center;
      backface-visibility: hidden;
      transition: transform 1.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .envelope-flap-top {
      clip-path: polygon(0 0, 100% 0, 50% 50%);
      transform-origin: top;
      z-index: 5;
    }

    .envelope-flap-bottom {
      clip-path: polygon(0 100%, 100% 100%, 50% 50%);
      transform-origin: bottom;
      z-index: 3;
    }

    .envelope-flap-left {
      clip-path: polygon(0 0, 0 100%, 50% 50%);
      transform-origin: left;
      z-index: 2;
    }

    .envelope-flap-right {
      clip-path: polygon(100% 0, 100% 100%, 50% 50%);
      transform-origin: right;
      z-index: 2;
    }

    .open .envelope-flap-top { transform: rotateX(180deg); }
    .open .envelope-flap-bottom { transform: rotateX(-180deg); }
    .open .envelope-flap-left { transform: rotateY(-180deg); }
    .open .envelope-flap-right { transform: rotateY(180deg); }

    .open.envelope-container {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1.2s ease 1s, visibility 1.2s ease 1s;
    }

    @media (max-width: 480px) {
      .tarjeta { padding: 30px 18px; }
    }
  </style>
</head>

<body>

<div class="mobile-screen">

    <audio id="bg-music" src="cancion.mp3" loop preload="auto"></audio>

    <!-- BOTÓN REPRODUCTOR DE MÚSICA -->
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()" aria-label="Controlar música">
        <svg id="musicIcon" viewBox="0 0 24 24">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
    </button>

    <div class="invitation-wrapper" id="invitation">

        <!-- 1. PORTADA -->
        <div class="image-section portada-section">
            <img src="portada.jpg" alt="Portada">
        </div>

        <!-- 2. PAPÁS -->
        <div class="image-section reveal-section">
            <img src="papas.jpg" alt="Nuestros Padres">
        </div>

        <!-- 3. FECHA -->
        <div class="image-section reveal-section">
            <img src="fecha.jpg" alt="Fecha">
        </div>

        <!-- 4. FOTO DE LA CUENTA REGRESIVA -->
        <div class="image-section reveal-section">
            <img src="cuenta.jpg" alt="Cuenta Regresiva">
        </div>

        <!-- 5. CONTADOR -->
        <div class="countdown-section reveal-section">
            <div class="countdown-flex">
                <div class="countdown-item">
                    <span id="days" class="countdown-number">00</span>
                    <span class="countdown-label">Días</span>
                </div>
                <div class="countdown-divider">•</div>
                <div class="countdown-item">
                    <span id="hours" class="countdown-number">00</span>
                    <span class="countdown-label">Horas</span>
                </div>
                <div class="countdown-divider">•</div>
                <div class="countdown-item">
                    <span id="minutes" class="countdown-number">00</span>
                    <span class="countdown-label">Minutos</span>
                </div>
                <div class="countdown-divider">•</div>
                <div class="countdown-item">
                    <span id="seconds" class="countdown-number">00</span>
                    <span class="countdown-label">Segundos</span>
                </div>
            </div>
        </div>

        <!-- 6. CEREMONIA Y RECEPCIÓN -->
        <div class="image-section reveal-section ceremony-container">
            <img src="ceremonia.jpg" alt="María Elena Salón de Eventos">
            
            <a href="https://www.google.com/maps/place/Mar%C3%ADa+Elena+Sal%C3%B3n+de+Eventos/@23.2781026,-106.3967481,770m/data=!3m1!1e3!4m14!1m7!3m6!1s0x8698ad92d9d55309:0x65c96fe87bd64a30!2sMar%C3%ADa+Elena+Sal%C3%B3n+de+Eventos!8m2!3d23.2781026!4d-106.3967481!16s%2Fg%2F11vbdxz7yc!3m5!1s0x8698ad92d9d55309:0x65c96fe87bd64a30!8m2!3d23.2781026!4d-106.3967481!16s%2Fg%2F11vbdxz7yc?entry=ttu&g_ep=EgoyMDI2MTAwNy4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" class="btn-overlay btn-ubicacion-salon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5-2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                Ver ubicación
            </a>
        </div>

        <!-- 7. VESTIMENTA -->
        <div class="image-section reveal-section">
            <img src="vestimenta.jpg" alt="Vestimenta">
        </div>

        <!-- 8. GALERÍA -->
        <div class="image-section reveal-section">
            <img src="galeria.jpg" alt="Galería">
        </div>

        <!-- 9. FOTOS DE LA GALERÍA (UNA POR UNA HACIA ABAJO) -->
        <div class="image-section reveal-section">
            <img src="https://i.imgur.com/ekcZ4Iv.jpeg" alt="Foto Galería 1">
        </div>

        <div class="image-section reveal-section">
            <img src="https://i.imgur.com/32PFBTa.jpeg" alt="Foto Galería 2">
        </div>

        <div class="image-section reveal-section">
            <img src="https://i.imgur.com/Fs3Jqs5.jpeg" alt="Foto Galería 3">
        </div>

        <!-- 10. NIÑOS -->
        <div class="image-section reveal-section">
            <img src="ninos.jpg" alt="No Niños">
        </div>

        <!-- 11. REGALO -->
        <div class="image-section reveal-section gift-container">
            <img src="regalo.jpg" alt="Regalo">
        </div>

        <!-- 12. ASISTENCIA -->
        <div class="image-section reveal-section">
            <img src="asistencia.jpg" alt="Asistencia">
        </div>

        <!-- 13. FORMULARIO DE ASISTENCIA -->
        <div class="rsvp-container-wrapper reveal-section">
            <div class="tarjeta">
              <div class="grupo">
                <label class="etiqueta">Nombre completo</label>
                <input id="nombre" type="text" placeholder="Nombre y dos apellidos" autocomplete="off">
              </div>

              <div class="grupo">
                <label class="etiqueta">¿Asistirás al evento?</label>
                <div class="opciones">
                  <div class="opcion">
                    <input type="radio" name="asistencia" id="si" value="Sí">
                    <label for="si">Sí asistiré</label>
                  </div>
                  <div class="opcion">
                    <input type="radio" name="asistencia" id="no" value="No">
                    <label for="no">No podré ir</label>
                  </div>
                </div>
              </div>

              <button class="boton" id="boton" onclick="enviar()">Enviar respuesta</button>

              <div id="mensaje" class="mensaje"></div>
            </div>
        </div>

    </div>

    <!-- SOBRE -->
    <div class="envelope-container" id="envelope">
        <div class="flap envelope-flap-top"></div>
        <div class="flap envelope-flap-bottom"></div>
        <div class="flap envelope-flap-left"></div>
        <div class="flap envelope-flap-right"></div>
    </div>

</div>

<script>
    let isOpen = false;
    const music = document.getElementById("bg-music");
    const wrapper = document.getElementById("invitation");
    const envelope = document.getElementById("envelope");
    const musicBtn = document.getElementById("musicBtn");
    const musicIcon = document.getElementById("musicIcon");

    const notePath = '<path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>';
    const pausePath = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    function openEnvelope() {
        if (!isOpen) {
            isOpen = true;
            envelope.classList.add("open");
            wrapper.classList.add("open-portada");
            musicBtn.classList.add("visible");
            
            if (music) {
                var playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.then(function() {
                        musicBtn.classList.add("playing");
                        musicIcon.innerHTML = notePath;
                    }).catch(function(error) {
                        console.log("Audio en reproducción manual:", error);
                        musicBtn.classList.remove("playing");
                        musicIcon.innerHTML = pausePath;
                    });
                }
            }

            checkScroll();
        }
    }

    envelope.addEventListener('click', openEnvelope);
    envelope.addEventListener('touchstart', openEnvelope, { passive: true });

    function toggleMusic() {
        if (music.paused) {
            music.play();
            musicBtn.classList.add("playing");
            musicIcon.innerHTML = notePath;
        } else {
            music.pause();
            musicBtn.classList.remove("playing");
            musicIcon.innerHTML = pausePath;
        }
    }

    function checkScroll() {
        const reveals = document.querySelectorAll('.reveal-section');
        const triggerBottom = wrapper.clientHeight * 0.9;

        reveals.forEach(section => {
            const sectionTop = section.getBoundingClientRect().top;
            if (sectionTop < triggerBottom) {
                section.classList.add('visible');
            }
        });
    }

    wrapper.addEventListener('scroll', checkScroll);

    /* LÓGICA DE LA CUENTA REGRESIVA PARA EL 14 DE NOVIEMBRE DE 2026 A LAS 8:00 PM */
    function updateCountdown() {
        const targetDate = new Date("November 14, 2026 20:00:00").getTime();
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
            document.getElementById('days').innerText = "00";
            document.getElementById('hours').innerText = "00";
            document.getElementById('minutes').innerText = "00";
            document.getElementById('seconds').innerText = "00";
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    /* LÓGICA DEL FORMULARIO DE ASISTENCIA CON GOOGLE APPS SCRIPT */
    const API_URL = "https://script.google.com/macros/s/AKfycbyailXTOEPgaCyepZnfbGTpOtxDGAC0Qn17H4qTQJf5f5wJGbY2zGCVWhAZSXde5uGXqQ/exec";

    let enviando = false;

    function normalizarTexto(texto) {
      if (!texto) return "";
      return texto
        .toString()
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
    }

    function llamarAPI(parametros) {
      return new Promise((resolve, reject) => {
        const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
        const script = document.createElement('script');
        const query = new URLSearchParams({ ...parametros, callback });
        
        const tiempo = setTimeout(() => { 
          limpiar(); 
          reject("Tiempo agotado"); 
        }, 25000);

        window[callback] = function(data) {
          clearTimeout(tiempo);
          limpiar();
          resolve(data);
        };

        function limpiar() {
          delete window[callback];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = function() {
          clearTimeout(tiempo);
          limpiar();
          reject("Error al conectar con el servidor");
        };

        script.src = API_URL + '?' + query.toString();
        document.body.appendChild(script);
      });
    }

    async function enviar() {
      if (enviando) return;

      const nombreInput = document.getElementById('nombre').value.trim();
      const asistencia = document.querySelector('input[name="asistencia"]:checked')?.value;
      const mensaje = document.getElementById('mensaje');
      const boton = document.getElementById('boton');

      if (!nombreInput || !asistencia) {
        mostrarMensaje('Por favor escribe tu nombre y selecciona si asistirás.');
        return;
      }

      const palabras = nombreInput.split(/\s+/).filter(word => word.length > 0);
      if (palabras.length < 3) {
        mostrarMensaje('Por favor ingresa tu nombre completo (Nombre y dos apellidos).');
        return;
      }

      enviando = true;
      boton.disabled = true;
      boton.textContent = 'Guardando...';
      mensaje.className = 'mensaje';

      try {
        const respuesta = await llamarAPI({
          action: 'confirmar',
          nombre: nombreInput,
          nombreClave: normalizarTexto(nombreInput),
          asistencia: asistencia
        });

        if (respuesta && respuesta.status === 'duplicado') {
          mostrarMensaje('Tu respuesta ya había sido registrada previamente.');
        } else {
          let mensajeExito = (asistencia === 'No') 
            ? 'Muchas gracias por responder. Lamentamos que no puedas acompañarnos.'
            : '¡Muchas gracias! Tu respuesta ha sido guardada exitosamente.';

          mostrarMensaje(mensajeExito);
          document.getElementById('nombre').value = '';
          document.querySelectorAll('input[name="asistencia"]').forEach(r => r.checked = false);
        }

      } catch (error) {
        console.error(error);
        mostrarMensaje('Ocurrió un error al guardar tu respuesta. Por favor intenta de nuevo.');
      } finally {
        enviando = false;
        boton.disabled = false;
        boton.textContent = 'Enviar respuesta';
      }
    }

    function mostrarMensaje(texto) {
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'mensaje visible';
      mensaje.textContent = texto;
    }
</script>

</body>
</html>
